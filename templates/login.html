{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 500px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-color);">Register here</a>
    </p>
</div>
{% endblock %}
