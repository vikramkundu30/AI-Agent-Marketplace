{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 0.5rem; text-align: center;">Send a Message</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">To: {{ recipient.name }} ({{ recipient.role|capitalize }})</p>
    
    <form method="POST" action="{{ url_for('contact', recipient_id=recipient.id) }}">
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" class="form-control" 
                   value="{% if context %}Regarding: {{ context }}{% endif %}" required>
        </div>
        
        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" class="form-control" rows="6" 
                      placeholder="Hi, I would like to buy..." required></textarea>
        </div>
        
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
            * Your email address ({{ session.get('user_email', 'your email') }}) will be shared with the recipient so they can reply.
        </p>
        
        <button type="submit" class="btn-primary" style="width: 100%;">Send Message via Email</button>
        <a href="javascript:history.back()" class="btn-outline" style="display: block; text-align: center; width: 100%; margin-top: 1rem; box-sizing: border-box;">Cancel</a>
    </form>
</div>
{% endblock %}
