{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Join the Network</h2>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="name">Full Name / Company Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="role">Account Type</label>
            <select id="role" name="role" class="form-control" required>
                <option value="customer">Customer</option>
                <option value="manufacturer">Manufacturer</option>
                <option value="shopkeeper">Shopkeeper</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="location">Location (City, Country)</label>
            <input type="text" id="location" name="location" class="form-control">
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-color);">Sign in</a>
    </p>
</div>
{% endblock %}
